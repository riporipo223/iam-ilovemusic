version: '3.8'

# Local dev infra only — Postgres and Redis. Production is expected to use
# managed services (Neon for Postgres, Upstash/Redis Cloud/etc for Redis).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ilovemusic
      POSTGRES_PASSWORD: ilovemusic
      POSTGRES_DB: ilovemusic
    ports:
      - '5432:5432'
    volumes:
      - ilovemusic_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  ilovemusic_pg_data:
