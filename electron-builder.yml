appId: com.ripox.ilovemusic
productName: ILoveMusic
directories:
  output: dist
  buildResources: build

# Icon configuration
# Place your icon.png file at: build/icons/icon.png (1024x1024 recommended)
# electron-builder will use it for all platforms
icon: build/icons/icon.png

files:
  - filter:
      - electron/**/*
      - renderer/dist/**/*
      - main.js
      - preload.js
      - package.json
      - "!**/node_modules/**/{CHANGELOG.md,README.md,README,readme.md,readme}"
      - "!**/node_modules/**/{test,__tests__,tests,powered-test,example,examples}"
      - "!**/node_modules/**/*.d.ts"
      - "!**/node_modules/**/.{yarn-integrity,yarn-metadata.json}"
      - "!**/node_modules/**/{.nyc_output,coverage,.nyc_output}"
      - "!**/node_modules/**/*.{iml,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,suo,xproj,cc,d.ts,mk,a,o,obj,forge-meta,pdb}"
      - "!**/._*"
      - "!**/{.git,.hg,.svn,CVS,RCS,SCCS,__pycache__,.DS_Store,thumbs.db,.gitignore,.gitkeep,.gitattributes,.npmignore,.idea,.vs,.flowconfig,.jshintrc,.eslintrc,.circleci,.yarn-integrity,.yarn-metadata.json,yarn-error.log,yarn.lock,package-lock.json,npm-debug.log,pnpm-lock.yaml,appveyor.yml,.travis.yml,circle.yml,.nyc_output,.husky,.github,electron-builder.env}"

extraResources:
  - from: renderer/dist
    to: app/dist
    filter:
      - "**/*"
  - from: build/bin/yt-dlp
    to: bin/yt-dlp
  - from: build/bin/win/yt-dlp.exe
    to: bin/yt-dlp.exe

mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  # spotdl/ffmpeg/ffprobe bundled here (mac-only), not in the shared
  # extraResources above, so they don't get copied into Windows builds too.
  # aubio is deliberately NOT bundled — no official static/portable build
  # exists for it (checked: aubio/aubio's GitHub releases ship source only,
  # every version). detectBPMFromAudio() already degrades gracefully to a
  # null BPM when aubio is missing, same as the existing python3/librosa
  # key-detection fallback — see CHANGELOG / release notes.
  extraResources:
    - from: build/bin/spotdl
      to: bin/spotdl
    - from: build/bin/ffmpeg
      to: bin/ffmpeg
    - from: build/bin/ffprobe
      to: bin/ffprobe
    # JS runtime for yt-dlp's YouTube extraction (SABR/anti-bot challenges
    # now require one — see yt-dlp/yt-dlp#15012). quickjs-ng's official
    # static build, not deno: same fix, ~1.2MB vs ~90MB+ for a V8-based
    # runtime. Wired in via ytDlpJsRuntimeArgs() in packages/engine, only
    # for the yt-dlp call site that actually hits YouTube.
    - from: build/bin/quickjs
      to: bin/quickjs

win:
  # icon: build/icons/icon.ico  # Uncomment when you have icon.ico file
  target:
    - nsis
    - portable

linux:
  target:
    - AppImage

electronVersion: 39.2.7

# Unpack ALL production dependencies from ASAR
# Archiver and its dependencies don't work well inside ASAR
# Solution: Unpack all node_modules to avoid missing any nested dependencies
asarUnpack:
  - "node_modules/**/*"

